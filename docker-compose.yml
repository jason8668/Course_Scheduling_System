# 正式部署设置。使用方式:
#   cp .env.example .env   # 修改管理员密码与校名
#   docker compose up -d
#   浏览器开 http://<主机IP>
#
# 六个容器:web(Caddy+前端)、api、worker(排课)、worker-ops(导出/备份/定时)、postgres、redis
#
# 两种部署方式,同一份档案:
#   从原始码建置:docker compose up -d           (git clone 本专案后,首次会建置映像)
#   拉取预建映像:docker compose pull && up -d    (只需本档+.env,免建置;升级亦同)
#
# worker 与 worker-ops 是同一个映像的两个行程:前者专跑自动排课(会占住好几分钟),
# 后者跑导出/备份/还原/寄信与定时任务,两条伫列互不堵塞(M6-2)。
# 映像版本由 .env 的 IMAGE_TAG 决定(默认 latest;正式部署建议钉选版本如 v1.0.0)。
name: scheduling

services:
  web:
    image: ghcr.io/begin0808/course_scheduling_system-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      # 默认 :80(内网 HTTP)。于 .env 设 SITE_ADDRESS=网域名 即启用自动 HTTPS(见 docs/deploy/https.md)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"   # 仅在设置网域启用 HTTPS 时使用;未用亦无妨
    volumes:
      - caddydata:/data            # 保存 HTTPS 凭证,重启不必重新申请(避免触发 Let's Encrypt 速率限制)
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/begin0808/course_scheduling_system-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: base
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Taipei}
      # 让 api 也知道站台位址:设了网域(HTTPS)时自动开启 cookie Secure 旗标
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      - backups:/backups   # 清单/下载/上传(实际 pg_dump 在 worker)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 排课 worker:守 default 伫列。一次自动排课可占住它好几分钟,这是预期行为。
  worker:
    image: ghcr.io/begin0808/course_scheduling_system-worker:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: worker
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - backups:/backups   # 与 worker-ops 共用(还原前的 presafe 备份等)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 维运 worker:守 ops 伫列(导出/备份/还原/寄信),并兼任定时任务排程器。
  # 存在的理由:排课那几分钟,正是组长最常按「导出课表」的时候——不该排在排课后面等。
  worker-ops:
    image: ghcr.io/begin0808/course_scheduling_system-worker:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: worker
    command: ["worker", "ops"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - backups:/backups   # pg_dump 写入、pg_restore 读取
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 开发/测试用假 SMTP:拦截外送信件,不真正寄出。正式部署不需要此服务
  # (将 SMTP 指向学校实际的邮件主机即可)。Web UI:http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  backups:
  caddydata:
