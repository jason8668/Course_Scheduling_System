[project]
name = "scheduling-backend"
version = "0.1.0"
description = "排课与调代课系统 — 后端 API 与排课引擎"
requires-python = ">=3.12"
# 核心相依一律钉主版号上限。理由是踩过:redis 未设上限,某次重建装到 redis-py 8,
# 阻塞式 XREAD 的行为变了,导出/备份在新环境一律逾时失败(v1.1 修)。
# 映像是每次发行重新建置的,不钉上限就等于「哪天上游发大版,用户的部署自己坏掉」。
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<9",
    "rq>=2.0,<3",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2,<6",
    "itsdangerous>=2.2,<3",
    "openpyxl>=3.1,<4",
    # 排课引擎(M3-2)。wheel 约 29MB,amd64/arm64 皆有 manylinux wheel。
    "ortools>=9.14,<10",
    # 钉钉群机器人发送(send_dingtalk 用)。之前只放在 dev 里,api 映像 pip install . 时
    # 不装 dev extra,线上一点测试消息就报 No module named 'httpx'。
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
# 导出(M5-1 起):PDF 产生。系统依赖(Pango 等)与中文字型只装在 worker 映像;
# api 映像维持精简,导出一律走背景任务(worker)。见 Dockerfile 的 worker 阶段。
export = [
    "weasyprint>=63",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入惯例:在参数默认值呼叫 Depends/require_roles 属正常用法
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "fastapi.File",
    "app.core.auth.require_roles",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "perf: 效能量测测试(规模资料下的时间门槛)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]
